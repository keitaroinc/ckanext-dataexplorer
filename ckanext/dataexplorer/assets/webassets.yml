# NOTE: the vendored libraries physically live under ``../public/vendor`` so
# that they are also served statically (recline.js is loaded dynamically from
# ``/vendor/recline/recline.js`` and Leaflet looks up its images there too).
# WebAssets bundle contents are resolved relative to this ``assets`` directory,
# so we reference them through ``../public/vendor`` to keep a single copy.
dataexplorer_css:
  output: dataexplorer/%(version)s_dataexplorer_css.css
  extra:
    preload:
      - base/main
  contents:
    - css/recline.css
    - css/recline.min.css

dataexplorer_js:
  output: dataexplorer/%(version)s_dataexplorer_js.js
  extra:
    preload:
      - base/main
  contents:
    - js/recline_view.js
    - js/widget.recordcount.js

dataexplorer_vendor_js:
  output: dataexplorer/%(version)s_dataexplorer_vendor_js.js
  extra:
    preload:
      - base/main
  contents:
    - ../public/vendor/jquery/1.7.1/jquery.js
    - ../public/vendor/underscore/1.4.4/underscore.js
    - ../public/vendor/backbone/1.0.0/backbone.js
    - ../public/vendor/mustache/0.5.0-dev/mustache.js
    - ../public/vendor/bootstrap/3.2.0/js/bootstrap.js
    - ../public/vendor/json/json2.js
    - ../public/vendor/flot/excanvas.js
    - ../public/vendor/flot/jquery.flot.js
    - ../public/vendor/flot/jquery.flot.time.js
    - ../public/vendor/leaflet/0.7.7/leaflet.js
    - ../public/vendor/leaflet.markercluster/leaflet.markercluster.js
    - ../public/vendor/slickgrid/2.2/jquery-ui-1.8.16.custom.js
    - ../public/vendor/slickgrid/2.2/jquery.event.drag-2.2.js
    - ../public/vendor/slickgrid/2.2/jquery.event.drop-2.2.js
    - ../public/vendor/slickgrid/2.2/slick.core.js
    - ../public/vendor/slickgrid/2.2/slick.formatters.js
    - ../public/vendor/slickgrid/2.2/slick.editors.js
    - ../public/vendor/slickgrid/2.2/slick.grid.js
    - ../public/vendor/slickgrid/2.2/plugins/slick.rowselectionmodel.js
    - ../public/vendor/slickgrid/2.2/plugins/slick.rowmovemanager.js
    - ../public/vendor/moment/2.0.0/moment.js
    - ../public/vendor/ckan.js/ckan.js

dataexplorer_vendor_css:
  output: dataexplorer/%(version)s_dataexplorer_vendor_css.css
  filters: cssrewrite
  contents:
    - ../public/vendor/bootstrap/3.2.0/css/bootstrap.css
    - ../public/vendor/leaflet/0.7.7/leaflet.css
    - ../public/vendor/leaflet.markercluster/MarkerCluster.css
    - ../public/vendor/leaflet.markercluster/MarkerCluster.Default.css
    - ../public/vendor/slickgrid/2.2/slick.grid.css
    - ../public/vendor/recline/slickgrid.css
    - ../public/vendor/recline/flot.css
    - ../public/vendor/recline/map.css
